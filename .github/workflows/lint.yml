name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.3', '7.4', '8.1', '8.3', '8.4']
    name: php ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: syntax check
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: unit tests
        run: php cli.php test pure

  database:
    runs-on: ubuntu-latest
    name: mysql ${{ matrix.mysql }}
    strategy:
      fail-fast: false
      matrix:
        mysql: ['5.7', '8.0']
    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: wxwclub_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, curl, openssl
          coverage: none
      - name: integration tests
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_DATABASE: wxwclub_test
          MYSQL_USER: root
          MYSQL_PASSWORD: ''
        run: php cli.php test
